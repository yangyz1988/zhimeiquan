# ========================================
# 智媒圈 生产环境 Docker Compose
# ========================================

version: '3.8'

services:
  # ─────────────────────────────────────────
  # PostgreSQL 生产数据库
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: zhimeiquan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhimeiquan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-zhimeiquan}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhimeiquan} -d ${POSTGRES_DB:-zhimeiquan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────
  # Redis 缓存 + 限流
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zhimeiquan-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────
  # 后端 API 服务
  # ─────────────────────────────────────────
  api:
    build:
      context: ./scripts
      dockerfile: Dockerfile.prod
      args:
        - PYTHON_VERSION=3.11
    image: zhimeiquan-api:prod
    container_name: zhimeiquan-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhimeiquan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhimeiquan}
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - API_SECRET=${API_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-https://www.zhimeiquan.com}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_data:/app/data
      - ./data:/app/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─────────────────────────────────────────
  # 前端 Next.js 服务
  # ─────────────────────────────────────────
  saas:
    build:
      context: ./saas
      dockerfile: Dockerfile.prod
      args:
        - NODE_VERSION=20
    image: zhimeiquan-saas:prod
    container_name: zhimeiquan-saas
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhimeiquan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhimeiquan}
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:8000
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://www.zhimeiquan.com}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_JWT_VERIFICATION_KEY=${CLERK_JWT_VERIFICATION_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - saas_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─────────────────────────────────────────
  # Nginx 反向代理 + SSL
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: zhimeiquan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/logs:/var/log/nginx
    depends_on:
      - saas
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─────────────────────────────────────────
  # 定时任务（热点扫描、数据清理等）
  # ─────────────────────────────────────────
  cron:
    build:
      context: ./scripts
      dockerfile: Dockerfile.cron
    image: zhimeiquan-cron:prod
    container_name: zhimeiquan-cron
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhimeiquan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhimeiquan}
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:rw
    restart: unless-stopped
    networks:
      - zhimeiquan-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  saas_data:
  api_data:

networks:
  zhimeiquan-net:
    driver: bridge